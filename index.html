<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Se usa como app: la pantalla no se agranda con dos dedos ni con doble
         toque. Android respeta `user-scalable=no`; iOS lo ignora desde iOS 10,
         así que ahí el zoom se corta además con `touch-action` (movil.css) y
         cancelando `gesturestart` (usePantallaNativa). `maximum-scale=1` evita
         además el zoom automático de iOS al tocar un campo de texto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Noni — Reservas online y gestión de agenda para barberías, bares, estética, veterinarias y más." />
    <meta name="theme-color" content="#E9EEF4" />
    <meta name="color-scheme" content="light" />

    <!-- iOS / PWA Support (iOS no soporta SVG como apple-touch-icon) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`: barra de estado con texto oscuro. Con `black-translucent` la
         hora y la batería salían en blanco sobre el fondo claro y no se veían. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noni" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: así se ve el link al compartirlo por WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noni" />
    <meta property="og:title" content="Noni — Reservá online" />
    <meta property="og:description" content="Elegí servicio, día y horario en menos de un minuto." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Google Fonts: Inter Tight (body) + Fraunces (editorial serif) + JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..900;1,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300..900&display=swap" rel="stylesheet" />

    <title>Noni — Reservas y gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; text-align: center; color: #007AFF">
        <h1 style="font-size: 20px">Necesitás activar JavaScript</h1>
        <p style="color: #4A5462">Noni no puede funcionar con JavaScript deshabilitado en tu navegador.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
