<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Sin `maximum-scale`/`user-scalable=no`: bloquear el zoom deja fuera a
         quien necesita agrandar el texto (y iOS lo ignora igual desde iOS 10). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Noni — Reservas online y gestión de agenda para barberías, bares, estética, veterinarias y más." />
    <meta name="theme-color" content="#5B3DF5" />
    <meta name="color-scheme" content="light" />

    <!-- iOS / PWA Support (iOS no soporta SVG como apple-touch-icon) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noni" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: así se ve el link al compartirlo por WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noni" />
    <meta property="og:title" content="Noni — Reservá online" />
    <meta property="og:description" content="Elegí servicio, día y horario en menos de un minuto." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Google Fonts: Inter Tight (body) + Fraunces (editorial serif) + JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..900;1,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300..900&display=swap" rel="stylesheet" />

    <title>Noni — Gestión Inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; text-align: center; color: #1E1B4B">
        <h1 style="font-size: 20px">Necesitás activar JavaScript</h1>
        <p style="color: #5B5580">Noni no puede funcionar con JavaScript deshabilitado en tu navegador.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
